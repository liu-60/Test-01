difficulty = "hard"
difficulty_explanation = "Requires POSIX shell portability, exact argv preservation, multi-signal forwarding, and bounded graceful shutdown with a deterministic kill fallback for a container-style backend launcher."
solution_explanation = "Replace the Bash-dependent launcher with a POSIX sh implementation that forwards each shutdown signal once, waits through interrupted waits, preserves the child's final status, and uses a one-second watchdog to kill an uncooperative worker."
verification_explanation = "Verifier runs shell syntax checks under /bin/sh and dash, adversarial argv cases, normal exit propagation, TERM/INT forwarding, multi-signal behavior, and bounded shutdown without exposing tests to the agent."
category = "software_engineering"
tags = ["shell", "compatibility-fix", "backend", "posix-sh", "signals"]
